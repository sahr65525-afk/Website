<!DOCTYPE html>
<html>
  <head>
    <title>Social Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: Arial, sans-serif;
      }

      .container {
        text-align: center;
        width: 90vw;
        max-width: 420px;
      }

      .logo {
        width: 150px;
        height: 150px;
        margin: 0 auto 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        border-radius: 50%;
        background-color: #fff;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
        align-items: center;
      }

      .social-button {
        padding: 15px 40px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s ease;
        color: white;
        width: 100%;
        max-width: 300px;
        text-align: center;
      }

      .tiktok-btn {
        background-color: #000;
      }

      .tiktok-btn:hover {
        background-color: #333;
        transform: scale(1.05);
      }

      .instagram-btn {
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      }

      .instagram-btn:hover {
        transform: scale(1.05);
        filter: brightness(1.1);
      }

      .facebook-btn {
        background-color: #1877f2;
      }

      .facebook-btn:hover {
        background-color: #166fe5;
        transform: scale(1.05);
      }

      /* Mobile adjustments */
      @media (max-width: 480px) {
        .logo {
          width: 110px;
          height: 110px;
          margin-bottom: 20px;
        }

        .social-button {
          padding: 12px 20px;
          font-size: 15px;
          max-width: 260px;
        }

        .buttons {
          gap: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <!-- Upload your logo as assets/logo.png -->
        <img src="assets/logo.png" alt="Profile" class="logo-img" onerror="this.style.display='none'" />
        <!-- Fallback emoji if image not available -->
        <div class="logo-fallback" aria-hidden="true">👤</div>
      </div>

      <div class="buttons">
        <!-- Facebook -->
        <a
          href="https://facebook.ritusah.com.np"
          target="_blank"
          class="social-button facebook-btn"
        >
          Facebook
        </a>

        <!-- Instagram -->
        <a
          href="https://instagram.ritusah.com.np"
          target="_blank"
          class="social-button instagram-btn"
        >
          Instagram
        </a>

        <!-- TikTok -->
        <a
          href="https://tiktok.ritusah.com.np"
          target="_blank"
          class="social-button tiktok-btn"
        >
          TikTok
        </a>
      </div>
    </div>
  </body>
</html>
